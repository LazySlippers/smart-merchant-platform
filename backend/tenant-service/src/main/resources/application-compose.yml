spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:13306/saas_tenant?useUnicode=true&characterEncoding=utf8&connectionTimeZone=Asia/Shanghai&forceConnectionTimeZoneToSession=true}
    username: ${DB_USERNAME:saas_tenant}
    password: ${DB_PASSWORD}
  data.redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
saas.security.runtime-state.enabled: true
