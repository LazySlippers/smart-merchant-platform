name: smart-merchant-saas
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      MYSQL_APP_PASSWORD: ${MYSQL_APP_PASSWORD:?set MYSQL_APP_PASSWORD}
    ports: ["${MYSQL_HOST_PORT:-13306}:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
      - ./mysql/init-users.sh:/docker-entrypoint-initdb.d/002-init-users.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?set RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?set RABBITMQ_DEFAULT_PASS}
    ports: ["5672:5672", "15672:15672"]
    volumes: ["rabbitmq-data:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 12
  nacos:
    image: nacos/nacos-server:v3.0.3
    environment:
      MODE: standalone
      # Local development only. Shared/production environments must enable auth
      # and provision a dedicated discovery client before services start.
      NACOS_AUTH_ENABLE: "false"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:?set NACOS_AUTH_TOKEN}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_IDENTITY_KEY:?set NACOS_IDENTITY_KEY}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_IDENTITY_VALUE:?set NACOS_IDENTITY_VALUE}
    ports: ["8848:8848", "9848:9848", "18080:8080"]
    volumes: ["nacos-data:/home/nacos/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:8848/nacos/v3/client/ns/instance/list?serviceName=compose-health-check' >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  nacos-data:
